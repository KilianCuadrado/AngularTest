<section>
    <h1>
        {{ username() }}'s tasks
    </h1>
    <button>Add task</button>
    <div class="task-list">
        @for (task of taskList; track task.id){
            @if(isSameUser(task.userId)){
                <h3>{{ task.title }}</h3>
                <p>{{task.dueDate}}</p>
                <p>{{task.summary}}</p>

            }
        }
    </div>
</section>
