<section>
    <h1>
        {{ user() ? user()!.name + "'s tasks" : 'Select a user' }}
    </h1>
    @if (user()) {
        <button>Add task</button>
    }
    <div class="task-list">
        @for (task of tasks; track task.id){
            @if(task.userId === user()?.id){
                <h3>{{ task.title }}</h3>
                <p>{{task.dueDate}}</p>
                <p>{{task.summary}}</p>

            }
        }
    </div>
</section>
