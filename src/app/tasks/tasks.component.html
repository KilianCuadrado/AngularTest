<section>
    @if (user()) {
        <h1>{{ user()?.name }}'s tasks</h1>
        <button type="button" (click)="isAddingTask = true">Add task</button>
    } @else {
        <h1>Select a user</h1>
    }

    @if (isAddingTask) {
        <app-task-form
            (addTask)="onAddTask($event); isAddingTask = false"
            (cancel)="isAddingTask = false"
        ></app-task-form>
    }
    <div class="task-list">
        @for (task of tasks; track task.id){
            @if (task.userId === user()?.id) {
                <h3>{{ task.title }}</h3>
                <p>{{task.dueDate}}</p>
                <p>{{task.summary}}</p>
                <button type="button" (click)="onDeleteTask(task.id)">Delete</button>
            }
        }
    </div>
</section>
